# The real gate, and the only relative one: `auto` compares each commit against
# its base, so the rule is "do not lose coverage", with a threshold of slack so
# a one-line move cannot fail a build.
#
# The absolute floors in .c8rc.json are a coarse backstop for the same property,
# not a second opinion about it. They sit below the measured 0.4.0 baseline
# (94.95% of lines, 82.55% of branches) and exist so a local run fails too,
# without waiting for Codecov. Neither number is an aspiration; raise them only
# by measuring first.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    # New code reports its own number without blocking. A patch gate belongs
    # here once there is enough history to know what a normal patch looks like.
    patch:
      default:
        informational: true

comment:
  layout: reach, diff, files
  require_changes: true
