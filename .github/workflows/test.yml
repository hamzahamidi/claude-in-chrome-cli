name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      # Every leg runs to completion: a Windows-only failure is the whole point
      # of having the leg, and cancelling the others hides whether it is
      # platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install dev dependencies
        run: npm ci
      # One c8 invocation per suite, so a failure names the suite that failed.
      # --reporter=none defers reporting to the step below: c8 otherwise prints
      # threshold errors from a partial run, which reads as a coverage
      # regression when the real problem is a failing test.
      - name: chrome-tabs SNSS parser
        run: npx c8 --reporter=none node test/test_tabs_parser.js
      - name: chrome-tabs MCP handshake
        shell: bash
        run: npx c8 --no-clean --reporter=none sh test/test_tabs_mcp.sh
      - name: BridgeSession dispatch flag and session reuse
        run: npx c8 --no-clean --reporter=none node test/test_bridge_session.js
      - name: tab lifecycle and fail-closed cleanup
        run: npx c8 --no-clean --reporter=none node test/test_tab_lifecycle.js
      - name: guided tab adoption
        run: npx c8 --no-clean --reporter=none node test/test_tab_adoption.js
      - name: image validation and atomic file output
        run: npx c8 --no-clean --reporter=none node test/test_image_output.js
      - name: session and shell streaming interfaces
        run: npx c8 --no-clean --reporter=none node test/test_session_command.js
      - name: cic contract, handshake ordering and retries
        run: npx c8 --no-clean --reporter=none node test/test_cic_cli.js
      # Windows deliberately runs less of the suite: the EPIPE pipeline and
      # detached-descendant tests are POSIX-only, so the paths they exercise are
      # legitimately unreached there. That calls for a floor of its own, not for
      # no floor: removing enforcement would let a real Windows regression
      # through unnoticed. The numbers are its measured baseline rounded down,
      # the same way the POSIX ones were.
      - name: coverage report and floors
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx c8 report --check-coverage --lines 97 --branches 89 --functions 98
          else
            npx c8 report --check-coverage
          fi
      - name: every version constant matches plugin.json
        shell: bash
        run: |
          plugin_version=$(node -p "require('./plugins/claude-in-chrome/.claude-plugin/plugin.json').version")
          server_version=$(node -p "require('./plugins/claude-in-chrome/tabs_mcp.js').SERVER_VERSION")
          package_version=$(node -p "require('./package.json').version")
          cli_version=$(node plugins/claude-in-chrome/bin/cic.js --version)
          lock_version=$(node -p "require('./package-lock.json').packages[''].version")
          echo "plugin.json: $plugin_version"
          echo "tabs_mcp.js: $server_version"
          echo "package.json: $package_version"
          echo "bin/cic.js: $cli_version"
          echo "package-lock.json: $lock_version"
          test "$plugin_version" = "$server_version"
          test "$plugin_version" = "$package_version"
          test "$plugin_version" = "$cli_version"
          test "$plugin_version" = "$lock_version"
      # One leg uploads. Every leg runs the same tests on the same commit, so a
      # second upload is a duplicate, not more evidence.
      - name: keep the coverage report
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22 && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # Needs the claude CLI and a global npm install, so it stays on one platform
  # rather than pretending to prove the install path everywhere.
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: install dev dependencies
        run: npm ci
      - name: install the claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.310
      - name: both install paths carry a working cic
        run: sh test/test_plugin_install.sh

  sonar:
    needs: test
    if: needs.test.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage
          path: coverage
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
